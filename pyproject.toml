[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aura"
version = "0.1.0"
description = "An Explainable Magic Mirror for 360 Postural Tracking and Multimodal Biofeedback"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.14",
    "fastdtw>=0.3.4",
    "numpy>=1.20.0"
]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:.*inference_feedback_manager.*:Warning",
]